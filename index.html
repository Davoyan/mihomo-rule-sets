<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ips-for-ru — проверка IP</title>
<script>
  (function () {
    const t = localStorage.getItem('theme');
    if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
  })();
</script>
<style>
  :root {
    --bg: #fff;
    --text: #1a1d21;
    --muted: #6b7280;
    --line: #e5e7eb;
    --accent: #2563eb;
    --tag: #f3f4f6;
    --tip-bg: #1a1d21;
    --tip-text: #f5f6f7;
    --ok: #16a34a;
    --no: #dc2626;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a;
      --text: #e8eaed;
      --muted: #9aa1ac;
      --line: #2a2f37;
      --accent: #60a5fa;
      --tag: #21262e;
      --tip-bg: #f5f6f7;
      --tip-text: #14161a;
      --ok: #4ade80;
      --no: #f87171;
    }
  }
  :root[data-theme="light"] {
    --bg: #fff;
    --text: #1a1d21;
    --muted: #6b7280;
    --line: #e5e7eb;
    --accent: #2563eb;
    --tag: #f3f4f6;
    --tip-bg: #1a1d21;
    --tip-text: #f5f6f7;
    --ok: #16a34a;
    --no: #dc2626;
  }
  :root[data-theme="dark"] {
    --bg: #14161a;
    --text: #e8eaed;
    --muted: #9aa1ac;
    --line: #2a2f37;
    --accent: #60a5fa;
    --tag: #21262e;
    --tip-bg: #f5f6f7;
    --tip-text: #14161a;
    --ok: #4ade80;
    --no: #f87171;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 20px 20px 60px;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .wrap { max-width: 680px; margin: 0 auto; }
  .bar { display: flex; justify-content: flex-end; margin-bottom: 16px; }
  #theme {
    display: flex;
    align-items: center;
    padding: 6px;
    color: var(--muted);
    background: none;
    border: 1px solid var(--line);
    border-radius: 8px;
    cursor: pointer;
  }
  #theme:hover { color: var(--text); }
  form { display: flex; gap: 8px; }
  input {
    flex: 1;
    min-width: 0;
    padding: 11px 14px;
    font-size: 16px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 8px;
    outline: none;
  }
  input:focus { border-color: var(--accent); }
  #go {
    padding: 11px 20px;
    font-size: 15px;
    color: #fff;
    background: var(--accent);
    border: 0;
    border-radius: 8px;
    cursor: pointer;
  }
  #go:disabled { opacity: .5; cursor: default; }
  #out { margin-top: 32px; }
  h1 {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 28px;
    font-weight: 600;
    margin: 0 0 20px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    letter-spacing: -0.01em;
    overflow-wrap: anywhere;
  }
  h1 svg { flex: none; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 11px 0; border-top: 1px solid var(--line); vertical-align: baseline; }
  th { width: 120px; font-weight: 400; color: var(--muted); }
  td { overflow-wrap: anywhere; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .country { display: inline-flex; align-items: center; gap: 7px; margin-right: 16px; }
  .country svg { display: block; box-shadow: 0 0 0 1px rgba(0,0,0,.18); }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tags span {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12.5px;
    background: var(--tag);
    border-radius: 5px;
    padding: 3px 8px;
  }
  [data-tip] { cursor: help; }
  th[data-tip] { text-decoration: underline dotted; text-underline-offset: 3px; }
  #tip {
    position: fixed;
    z-index: 10;
    display: none;
    max-width: 290px;
    padding: 7px 10px;
    font-size: 12.5px;
    line-height: 1.45;
    color: var(--tip-text);
    background: var(--tip-bg);
    border-radius: 6px;
    box-shadow: 0 4px 14px rgba(0,0,0,.18);
    pointer-events: none;
  }
  .empty { color: var(--muted); }
  footer {
    margin-top: 40px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
    font-size: 13px;
    color: var(--muted);
  }
  footer a { color: var(--accent); text-decoration: none; }
  footer a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <button id="theme" type="button" title="Тема"></button>
  </div>
  <form id="f">
    <input id="q" type="text" placeholder="IP или подсеть" autocomplete="off" spellcheck="false">
    <button id="go" type="submit" disabled>Поиск</button>
  </form>
  <div id="out"></div>
  <footer>
    <a href="https://github.com/Davoyan/mihomo-rule-sets" target="_blank" rel="noopener">github.com/Davoyan/mihomo-rule-sets</a>
  </footer>
</div>
<div id="tip"></div>

<script>
const DATA_URL = 'ip-for-ru/annotated/ips-for-ru-annotated.txt';

const COUNTRY_ORDER = ['RU', 'BY'];

const COUNTRIES = {
  RU: ['Россия', '<svg width="22" height="15" viewBox="0 0 9 6"><rect width="9" height="6" fill="#fff"/><rect y="2" width="9" height="2" fill="#0039a6"/><rect y="4" width="9" height="2" fill="#d52b1e"/></svg>'],
  BY: ['Беларусь', '<svg width="22" height="15" viewBox="0 0 9 6"><rect width="9" height="4" fill="#c8313e"/><rect y="4" width="9" height="2" fill="#4aa657"/><rect width="1.1" height="6" fill="#fff"/><g fill="#c8313e"><rect x=".35" y=".3" width=".4" height=".4"/><rect x=".35" y="1.3" width=".4" height=".4"/><rect x=".35" y="2.3" width=".4" height=".4"/><rect x=".35" y="3.3" width=".4" height=".4"/><rect x=".35" y="4.3" width=".4" height=".4"/><rect x=".35" y="5.3" width=".4" height=".4"/></g></svg>']
};

const ICON_OK = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--ok)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" stroke-width="2"/><path d="M7.5 12.5l3 3 6-6.5"/></svg>';
const ICON_NO = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--no)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" stroke-width="2"/><path d="M8.5 8.5l7 7M15.5 8.5l-7 7"/></svg>';
const ICON_SUN = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.5 1.5M17.6 17.6l1.5 1.5M19.1 4.9l-1.5 1.5M6.4 17.6l-1.5 1.5"/></svg>';
const ICON_MOON = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 019.5 4a8.5 8.5 0 1010.5 10.5z"/></svg>';

const RULES_TIP = 'Правила, по которым в список попали подсети, из которых собран этот диапазон';

let v4 = null, v6 = null;

function v4ToInt(s) {
  const p = s.split('.');
  if (p.length !== 4) return null;
  let n = 0;
  for (const x of p) {
    if (!/^\d{1,3}$/.test(x)) return null;
    const v = +x;
    if (v > 255) return null;
    n = n * 256 + v;
  }
  return n;
}

function v6ToHex(str) {
  let s = str.trim().toLowerCase();
  if (!s.includes(':')) return null;
  const lastColon = s.lastIndexOf(':');
  const tail = s.slice(lastColon + 1);
  if (tail.includes('.')) {
    const n = v4ToInt(tail);
    if (n === null) return null;
    s = s.slice(0, lastColon + 1) + Math.floor(n / 65536).toString(16) + ':' + (n % 65536).toString(16);
  }
  const parts = s.split('::');
  if (parts.length > 2) return null;
  const head = parts[0] ? parts[0].split(':') : [];
  const back = parts.length === 2 ? (parts[1] ? parts[1].split(':') : []) : [];
  let groups;
  if (parts.length === 2) {
    const total = head.length + back.length;
    if (total > 7) return null;
    groups = head.concat(new Array(8 - total).fill('0'), back);
  } else {
    if (head.length !== 8) return null;
    groups = head;
  }
  let out = '';
  for (const g of groups) {
    if (!/^[0-9a-f]{1,4}$/.test(g)) return null;
    out += g.padStart(4, '0');
  }
  return out.length === 32 ? out : null;
}

function v6End(hex, prefix) {
  const full = prefix >> 2;
  const rem = prefix & 3;
  if (full >= 32) return hex;
  let out = hex.slice(0, full);
  out += rem ? (parseInt(hex[full], 16) | (0xf >> rem)).toString(16) : 'f';
  return out.padEnd(32, 'f');
}

function v6Start(hex, prefix) {
  const full = prefix >> 2;
  const rem = prefix & 3;
  if (full >= 32) return hex;
  let out = hex.slice(0, full);
  out += rem ? (parseInt(hex[full], 16) & ~(0xf >> rem) & 0xf).toString(16) : '0';
  return out.padEnd(32, '0');
}

function parseData(text) {
  const s4 = [], e4 = [], a4 = [], c4 = [];
  const s6 = [], e6 = [], a6 = [], c6 = [];
  let pos = 0;
  const len = text.length;
  while (pos < len) {
    let nl = text.indexOf('\n', pos);
    if (nl === -1) nl = len;
    let line = text.slice(pos, nl);
    pos = nl + 1;
    if (line.charCodeAt(line.length - 1) === 13) line = line.slice(0, -1);
    if (!line) continue;
    const sp = line.indexOf(' ');
    const open = line.indexOf('[', sp);
    const close = line.lastIndexOf(']');
    if (sp === -1 || open === -1 || close <= open) continue;
    const cidr = line.slice(0, sp);
    const ann = line.slice(open + 1, close);
    const slash = cidr.lastIndexOf('/');
    const addr = cidr.slice(0, slash);
    const prefix = +cidr.slice(slash + 1);
    if (addr.includes(':')) {
      const hex = v6ToHex(addr);
      if (hex === null) continue;
      s6.push(hex); e6.push(v6End(hex, prefix)); a6.push(ann); c6.push(cidr);
    } else {
      const n = v4ToInt(addr);
      if (n === null) continue;
      s4.push(n); e4.push(n + Math.pow(2, 32 - prefix) - 1); a4.push(ann); c4.push(cidr);
    }
  }
  v4 = { start: Float64Array.from(s4), end: Float64Array.from(e4), ann: a4, cidr: c4 };
  v6 = { start: s6, end: e6, ann: a6, cidr: c6 };
}

function lookup(store, value) {
  const start = store.start;
  let lo = 0, hi = start.length - 1, found = -1;
  while (lo <= hi) {
    const mid = (lo + hi) >> 1;
    if (start[mid] <= value) { found = mid; lo = mid + 1; }
    else hi = mid - 1;
  }
  if (found === -1 || store.end[found] < value) return null;
  return { cidr: store.cidr[found], ann: store.ann[found] };
}

function parseQuery(raw) {
  const s = raw.trim();
  if (!s) return null;
  const slash = s.indexOf('/');
  const addr = slash === -1 ? s : s.slice(0, slash);
  const isV6 = addr.includes(':');
  let prefix = null;
  if (slash !== -1) {
    const p = s.slice(slash + 1);
    if (!/^\d{1,3}$/.test(p)) return null;
    prefix = +p;
    if (prefix > (isV6 ? 128 : 32)) return null;
  }
  if (isV6) {
    const hex = v6ToHex(addr);
    if (hex === null) return null;
    return { isV6: true, value: prefix === null ? hex : v6Start(hex, prefix) };
  }
  const n = v4ToInt(addr);
  if (n === null) return null;
  return { isV6: false, value: prefix === null ? n : n - (n % Math.pow(2, 32 - prefix)) };
}

function esc(s) {
  return s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

function analyze(ann) {
  const sources = [], rules = [], codes = [];
  for (const chunk of ann.split(';')) {
    const t = chunk.trim();
    const sp = t.indexOf(' ');
    const name = sp === -1 ? t : t.slice(0, sp);
    if (!sources.includes(name)) sources.push(name);
    if (sp === -1) continue;
    for (const r of t.slice(sp + 1).split(',')) {
      const rule = r.trim();
      if (!rule) continue;
      const m = rule.match(/^\{([A-Z]{2})\}$/);
      if (m) { if (!codes.includes(m[1])) codes.push(m[1]); continue; }
      if (!rules.includes(rule)) rules.push(rule);
    }
  }
  codes.sort((a, b) => {
    const ia = COUNTRY_ORDER.indexOf(a), ib = COUNTRY_ORDER.indexOf(b);
    return (ia === -1 ? COUNTRY_ORDER.length : ia) - (ib === -1 ? COUNTRY_ORDER.length : ib) || a.localeCompare(b);
  });
  return { sources, rules, codes };
}

function ruleTip(rule) {
  if (/^AS\d+$/.test(rule)) return 'Подсети автономной системы ' + rule;
  let m = rule.match(/^AS-NAME:(.+)$/);
  if (m) return 'В названии автономной системы есть «' + m[1] + '»';
  m = rule.match(/^AS-DOMAIN:(.+)$/);
  if (m) return 'В основном домене автономной системы есть «' + m[1] + '»';
  m = rule.match(/^DOMAIN-FULL:(.+)$/);
  if (m) return 'Основной домен автономной системы — ' + m[1];
  return '';
}

function tags(items, tipFn) {
  return '<div class="tags">' + items.map(i => {
    const tip = tipFn ? tipFn(i) : '';
    return '<span' + (tip ? ' data-tip="' + esc(tip) + '"' : '') + '>' + esc(i) + '</span>';
  }).join('') + '</div>';
}

function row(label, value, tip) {
  const th = tip ? '<th data-tip="' + esc(tip) + '">' + label + '</th>' : '<th>' + label + '</th>';
  return '<tr>' + th + '<td>' + value + '</td></tr>';
}

function search() {
  const raw = document.getElementById('q').value.trim();
  const out = document.getElementById('out');
  hideTip();
  if (!raw) { out.innerHTML = ''; history.replaceState(null, '', location.pathname); return; }

  const url = new URL(location.href);
  url.searchParams.set('q', raw);
  history.replaceState(null, '', url);

  const q = parseQuery(raw);
  if (!q) { out.innerHTML = '<h1>' + ICON_NO + esc(raw) + '</h1><p class="empty">Некорректный адрес</p>'; return; }

  const hit = lookup(q.isV6 ? v6 : v4, q.value);
  if (!hit) { out.innerHTML = '<h1>' + ICON_NO + esc(raw) + '</h1><p class="empty">Нет в списке</p>'; return; }

  const { sources, rules, codes } = analyze(hit.ann);
  let html = '<h1>' + ICON_OK + esc(raw) + '</h1><table>';
  html += row('Подсеть', '<span class="mono">' + esc(hit.cidr) + '</span>');
  html += row('Страна', codes.map(c => '<span class="country">' + COUNTRIES[c][1] + COUNTRIES[c][0] + '</span>').join(''));
  html += row('Источники', tags(sources));
  if (rules.length) html += row('Правила', tags(rules, ruleTip), RULES_TIP);
  out.innerHTML = html + '</table>';
}

const tipEl = document.getElementById('tip');
let tipFor = null;

function showTip(el) {
  const text = el.dataset.tip;
  if (!text) return;
  tipEl.textContent = text;
  tipEl.style.display = 'block';
  const r = el.getBoundingClientRect();
  const t = tipEl.getBoundingClientRect();
  let left = r.left + r.width / 2 - t.width / 2;
  left = Math.max(8, Math.min(left, document.documentElement.clientWidth - t.width - 8));
  let top = r.top - t.height - 8;
  if (top < 8) top = r.bottom + 8;
  tipEl.style.left = left + 'px';
  tipEl.style.top = top + 'px';
  tipFor = el;
}

function hideTip() {
  tipEl.style.display = 'none';
  tipFor = null;
}

function applyTheme(mode) {
  const dark = mode === 'dark' || (mode === null && matchMedia('(prefers-color-scheme: dark)').matches);
  document.getElementById('theme').innerHTML = dark ? ICON_SUN : ICON_MOON;
  if (mode === null) delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = mode;
}

async function boot() {
  const out = document.getElementById('out');
  const go = document.getElementById('go');
  const q = document.getElementById('q');
  const theme = document.getElementById('theme');

  const saved = localStorage.getItem('theme');
  applyTheme(saved === 'dark' || saved === 'light' ? saved : null);
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
    if (!document.documentElement.dataset.theme) applyTheme(null);
  });
  theme.addEventListener('click', () => {
    const next = document.documentElement.dataset.theme === 'dark' ? 'light'
      : document.documentElement.dataset.theme === 'light' ? 'dark'
      : matchMedia('(prefers-color-scheme: dark)').matches ? 'light' : 'dark';
    localStorage.setItem('theme', next);
    applyTheme(next);
  });

  document.addEventListener('mouseover', e => {
    const el = e.target.closest('[data-tip]');
    if (el && el !== tipFor) showTip(el);
  });
  document.addEventListener('mouseout', e => {
    if (e.target.closest('[data-tip]')) hideTip();
  });
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-tip]');
    if (el) { el === tipFor ? hideTip() : showTip(el); }
    else hideTip();
  });
  addEventListener('scroll', hideTip, { passive: true });
  addEventListener('resize', hideTip);

  document.getElementById('f').addEventListener('submit', e => { e.preventDefault(); search(); });

  out.innerHTML = '<p class="empty">Загрузка…</p>';
  try {
    const res = await fetch(DATA_URL, { cache: 'no-cache' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    parseData(await res.text());
    out.innerHTML = '';
    go.disabled = false;
    const initial = new URL(location.href).searchParams.get('q');
    if (initial) { q.value = initial; search(); }
    q.focus();
  } catch (e) {
    out.innerHTML = '<p class="empty">Не удалось загрузить список: ' + esc(e.message) + '</p>';
  }
}

boot();
</script>
</body>
</html>
